<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cadastro — Zenith Tracker</title>
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>
</head>
<body>
<div class="split">
  <section class="vitrine">
    <p class="marca-nome">Zenith Tracker</p>
    <div>
      <p class="vitrine-titulo">Nutrição do treino híbrido, no papel certo.</p>
      <p class="apoio" style="color:inherit;opacity:.7">O papel escolhido aqui não muda sozinho depois.</p>
    </div>
    <p class="apoio" style="color:inherit;opacity:.6">Aluno ou treinador — cada um entra na própria área.</p>
  </section>
  <main class="auth">
    <div class="auth-caixa">
      <h1>Criar conta</h1>
      <form id="cadastro" action="aluno.html">
        <div class="campo">
          <label for="name">Nome</label>
          <input id="name" name="name" type="text" autocomplete="name"/>
        </div>
        <div class="papeis" role="group" aria-label="Papel">
          <button type="button" class="papel" id="papel-aluno" aria-pressed="true">Aluno</button>
          <button type="button" class="papel" id="papel-treinador" aria-pressed="false">Treinador</button>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username"/>
        </div>
        <div class="campo">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="new-password"/>
        </div>
        <div class="campo">
          <label for="confirmPassword">Confirmar senha</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"/>
        </div>
        <button class="btn" type="submit">Criar conta</button>
      </form>
      <p class="nav">E-mail já cadastrado: <a href="cadastro-erro.html">este e-mail já existe</a></p>
      <p class="nav"><a href="login.html">Já tenho conta</a></p>
    </div>
  </main>
</div>
<script src="theme.js"></script>
<script>
  var form = document.getElementById("cadastro");
  var aluno = document.getElementById("papel-aluno");
  var treinador = document.getElementById("papel-treinador");
  var destino = "aluno.html";
  function escolher(papel) {
    destino = papel === "treinador" ? "painel.html" : "aluno.html";
    aluno.setAttribute("aria-pressed", papel === "aluno" ? "true" : "false");
    treinador.setAttribute("aria-pressed", papel === "treinador" ? "true" : "false");
  }
  aluno.addEventListener("click", function () { escolher("aluno"); });
  treinador.addEventListener("click", function () { escolher("treinador"); });
  form.addEventListener("submit", function () { form.action = destino; });
</script>
</body>
</html>
