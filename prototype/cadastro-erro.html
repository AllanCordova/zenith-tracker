<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cadastro — Zenith Tracker</title>
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>
</head>
<body>
<div class="split">
  <section class="vitrine">
    <p class="marca-nome">Zenith Tracker</p>
    <p class="vitrine-titulo">Nutrição do treino híbrido, no papel certo.</p>
    <p class="apoio" style="color:inherit;opacity:.6">O papel escolhido aqui não muda sozinho depois.</p>
  </section>
  <main class="auth">
    <div class="auth-caixa">
      <h1>Criar conta</h1>
      <form action="cadastro-erro.html">
        <div class="campo">
          <label for="name">Nome</label>
          <input id="name" name="name" type="text" value="Ana Lima"/>
        </div>
        <div class="papeis">
          <button type="button" class="papel" aria-pressed="true">Aluno</button>
          <button type="button" class="papel" aria-pressed="false">Treinador</button>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" value="ana@zenith.dev" aria-invalid="true"/>
          <p class="campo-erro" role="alert">Este e-mail já existe</p>
        </div>
        <div class="campo">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" value="senha-segura"/>
        </div>
        <button class="btn" type="submit">Criar conta</button>
      </form>
      <p class="nav"><a href="cadastro.html">Voltar ao cadastro</a></p>
      <p class="nav"><a href="login.html">Já tenho conta</a></p>
    </div>
  </main>
</div>
<script src="theme.js"></script>
</body>
</html>
