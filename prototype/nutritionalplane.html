<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dados pessoais — Zenith Tracker</title>
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>
</head>
<body>
<header class="header">
  <a class="marca" href="wallet.html">Zenith Tracker</a>
  <div class="header-acoes">
    <a class="icon-btn" href="login.html" aria-label="Sair">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6H5v12h4"/><path d="M10 12h9"/><path d="M16 8l4 4-4 4"/></svg>
    </a>
    <button class="icon-btn" type="button" data-theme aria-label="Tema">Aa</button>
  </div>
</header>
<main>
  <div class="wrap wrap-form">
    <p class="kicker">Passo 01</p>
    <h1>Dados pessoais</h1>
    <p class="apoio">Idade, peso, altura e sexo biológico de Lucas Mendes. Sem estes campos o plano não fica vigente.</p>
    <nav class="passos" aria-label="Passos do plano">
      <a class="passo ativo" href="nutritionalplane.html">01 Dados</a>
      <a class="passo" href="activty-plane.html">02 Rotina</a>
      <a class="passo" href="comfirm-plane.html">03 Revisão</a>
    </nav>
    <form class="panel" action="activty-plane.html">
      <div class="campo">
        <label for="idade">Idade</label>
        <input id="idade" name="idade" type="number" inputmode="numeric" value="28"/>
      </div>
      <div class="campo">
        <label for="peso">Peso (kg)</label>
        <input id="peso" name="peso" type="number" inputmode="decimal" step="0.1" value="83.5"/>
      </div>
      <div class="campo">
        <label for="altura">Altura (cm)</label>
        <input id="altura" name="altura" type="number" inputmode="numeric" value="182"/>
      </div>
      <div class="campo">
        <label for="sexo">Sexo biológico</label>
        <select id="sexo" name="sexo">
          <option>Masculino</option>
          <option>Feminino</option>
        </select>
      </div>
      <div class="acoes">
        <a class="link" href="wallet.html">Retornar à carteira</a>
        <button class="btn-inline" type="submit">Prosseguir</button>
      </div>
    </form>
  </div>
</main>
<footer class="footer">
  <div class="footer-inner">
    <span>Zenith Tracker</span>
  </div>
</footer>
<script src="theme.js"></script>
</body>
</html>
