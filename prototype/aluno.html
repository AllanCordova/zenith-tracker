<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aluno — Zenith Tracker</title>
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="marca-bloco">
      <span class="mark">Z</span>
      <div>
        <p class="marca-nome">Zenith Tracker</p>
        <p class="apoio">Acompanhamento</p>
      </div>
    </div>
    <nav class="side-nav" aria-label="Área do aluno">
      <a class="nav-item ativo" href="aluno.html">Área</a>
    </nav>
    <div class="side-fim">
      <button class="icon-btn" type="button" data-theme aria-label="Tema">Aa</button>
      <a class="sair" href="login.html">Sair</a>
    </div>
  </aside>
  <div class="coluna">
    <header class="mobile-bar">
      <p class="marca-nome">Zenith Tracker</p>
      <a class="sair" href="login.html">Sair</a>
    </header>
    <main class="miolo">
      <p class="kicker">Área do aluno</p>
      <h1>Ana Lima</h1>
      <section class="painel">
        <p class="apoio" style="margin-top:0">Plano ainda não fechado</p>
        <p id="papel" class="erro" hidden>Você continua na área do aluno.</p>
        <p class="nav"><a href="aluno.html#papel">Abrir a área do treinador</a></p>
      </section>
    </main>
    <nav class="dock" aria-label="Área do aluno">
      <a class="ativo" href="aluno.html">Área</a>
    </nav>
  </div>
</div>
<script src="theme.js"></script>
<script>
  function mostrarPapel() {
    if (location.hash === "#papel") document.getElementById("papel").hidden = false;
  }
  mostrarPapel();
  window.addEventListener("hashchange", mostrarPapel);
</script>
</body>
</html>
