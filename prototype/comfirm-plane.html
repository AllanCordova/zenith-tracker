<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Revisão — Zenith Tracker</title>
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>
</head>
<body>
<header class="header">
  <a class="marca" href="wallet.html">Zenith Tracker</a>
  <div class="header-acoes">
    <a class="icon-btn" href="login.html" aria-label="Sair">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6H5v12h4"/><path d="M10 12h9"/><path d="M16 8l4 4-4 4"/></svg>
    </a>
    <button class="icon-btn" type="button" data-theme aria-label="Tema">Aa</button>
  </div>
</header>
<main>
  <div class="wrap wrap-form">
    <p class="kicker">Passo 03</p>
    <h1>Revisão</h1>
    <p class="apoio">Aceite ou edite o teto sugerido, ajuste os macros e grave a margem. O aluno vê o teto e os macros — nunca a margem nem o sugerido bruto.</p>
    <nav class="passos" aria-label="Passos do plano">
      <a class="passo" href="nutritionalplane.html">01 Dados</a>
      <a class="passo" href="activty-plane.html">02 Rotina</a>
      <a class="passo ativo" href="comfirm-plane.html">03 Revisão</a>
    </nav>
    <form class="panel" action="wallet.html">
      <fieldset class="campo" style="border:0;padding:0;margin:1rem 0 0">
        <legend class="link">Objetivo</legend>
        <div class="opcoes">
          <label class="opcao"><input type="radio" name="objetivo" value="emagrecimento"/> Emagrecimento</label>
          <label class="opcao"><input type="radio" name="objetivo" value="hipertrofia" checked/> Hipertrofia</label>
          <label class="opcao"><input type="radio" name="objetivo" value="manutencao"/> Manutenção</label>
        </div>
      </fieldset>
      <div class="campo">
        <label for="teto">Teto sugerido (kcal)</label>
        <input id="teto" name="teto" type="number" inputmode="numeric" value="2860"/>
      </div>
      <div class="campo">
        <label for="proteina">Proteína (g)</label>
        <input id="proteina" name="proteina" type="number" inputmode="numeric" value="184"/>
      </div>
      <div class="campo">
        <label for="gordura">Gordura (g)</label>
        <input id="gordura" name="gordura" type="number" inputmode="numeric" value="79"/>
      </div>
      <div class="campo">
        <label for="carboidrato">Carboidrato (g)</label>
        <input id="carboidrato" name="carboidrato" type="number" inputmode="numeric" value="353"/>
      </div>
      <div class="campo">
        <label for="margem">Margem de erro (kcal)</label>
        <input id="margem" name="margem" type="number" inputmode="numeric" value="100"/>
        <p class="apoio">Invisível para o aluno.</p>
      </div>
      <div class="acoes">
        <a class="link" href="activty-plane.html">Voltar à rotina</a>
        <button class="btn-inline" type="submit">Gravar setup</button>
      </div>
    </form>
  </div>
</main>
<footer class="footer">
  <div class="footer-inner">
    <span>Zenith Tracker</span>
  </div>
</footer>
<script src="theme.js"></script>
</body>
</html>
