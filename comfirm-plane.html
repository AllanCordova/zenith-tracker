<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Setup — Zenith Tracker</title>
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="marca-bloco">
      <span class="mark">Z</span>
      <div>
        <p class="marca-nome">Zenith Tracker</p>
        <p class="apoio">Painel</p>
      </div>
    </div>
    <nav class="side-nav" aria-label="Painel">
      <a class="nav-item ativo" href="wallet.html">Carteira</a>
      <a class="nav-item" href="assinatura-ativa.html">Assinatura</a>
    </nav>
    <div class="side-fim">
      <button class="icon-btn" type="button" data-theme aria-label="Tema">Aa</button>
      <a class="sair" href="login.html">Sair</a>
    </div>
  </aside>
  <div class="coluna">
    <header class="mobile-bar">
      <p class="marca-nome">Zenith Tracker</p>
      <a class="sair" href="login.html">Sair</a>
    </header>
    <main class="miolo">
      <div class="setup">
        <ol class="setup-passos" aria-label="Passos do plano">
          <li><a href="nutritionalplane.html">Antropometria</a></li>
          <li><a href="activty-plane.html">Rotina</a></li>
          <li><a class="ativo" href="comfirm-plane.html">Revisão</a></li>
        </ol>
        <form action="wallet.html">
          <p class="nome-aluno">Lucas Mendes</p>
          <h1>Setup</h1>
          <div class="painel grade-campos">
            <p class="apoio">Sugestão do motor: 2.860 kcal. O aluno vê o teto e os macros — nunca a margem nem o sugerido bruto.</p>
            <div class="campo">
              <label for="objetivo">Objetivo</label>
              <select id="objetivo" name="objetivo">
                <option value="emagrecimento">Emagrecimento</option>
                <option value="hipertrofia" selected>Hipertrofia</option>
                <option value="manutencao">Manutenção</option>
              </select>
            </div>
            <div class="campo">
              <label for="teto">Teto aceito</label>
              <input id="teto" name="teto" type="number" value="2860" required/>
            </div>
            <div class="grade-macros">
              <div class="campo">
                <label for="proteina">Proteína</label>
                <input id="proteina" name="proteina" type="number" value="184"/>
              </div>
              <div class="campo">
                <label for="carboidrato">Carboidrato</label>
                <input id="carboidrato" name="carboidrato" type="number" value="353"/>
              </div>
              <div class="campo">
                <label for="gordura">Gordura</label>
                <input id="gordura" name="gordura" type="number" value="79"/>
              </div>
            </div>
            <div class="campo">
              <label for="margem">Margem de erro (kcal) — o aluno não vê</label>
              <input id="margem" name="margem" type="number" value="100"/>
            </div>
          </div>
          <button class="btn" type="submit">Gravar setup</button>
        </form>
      </div>
    </main>
    <nav class="dock" aria-label="Painel">
      <a class="ativo" href="wallet.html">Carteira</a>
      <a href="assinatura-ativa.html">Assinatura</a>
    </nav>
  </div>
</div>
<script src="theme.js"></script>
</body>
</html>
