<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Entrar — Zenith Tracker</title>
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>
</head>
<body>
<div class="split">
  <section class="vitrine">
    <p class="marca-nome">Zenith Tracker</p>
    <div>
      <p class="vitrine-titulo">O teto acompanha a dieta. A carteira fica num lugar só.</p>
      <p class="apoio" style="color:inherit;opacity:.7">Treino híbrido, sem redigitar o peso e sem viver no WhatsApp.</p>
    </div>
    <p class="apoio" style="color:inherit;opacity:.6">Aluno ou treinador — cada um entra na própria área.</p>
  </section>
  <main class="auth">
    <div class="auth-caixa">
      <h1>Entrar</h1>
      <p class="apoio">A área abre no papel da conta.</p>
      <form action="login-erro.html">
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" value="ana@zenith.dev"/>
        </div>
        <div class="campo">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" value="senha-errada"/>
        </div>
        <p class="erro" role="alert">A combinação não confere</p>
        <button class="btn" type="submit">Entrar</button>
      </form>
      <p class="nav"><a href="login.html">Tentar de novo</a></p>
      <p class="nav"><a href="cadastro.html">Ainda não tenho conta</a></p>
    </div>
  </main>
</div>
<script src="theme.js"></script>
</body>
</html>
